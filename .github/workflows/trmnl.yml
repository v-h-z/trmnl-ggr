name: TRMNL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the snapshots in tests/snapshots and upload them
        type: boolean
        default: false

env:
  # The trmnlp image the tests run in. Pin a release (trmnl/trmnlp:v0.17.0) to keep runs repeatable.
  TRMNLP_IMAGE: trmnl/trmnlp:latest

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview
      - run: trmnlp lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: trmnlp test
        run: >
          docker run --rm -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md
          -v "$PWD":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md "$TRMNLP_IMAGE"
          test --report report ${{ inputs.update_snapshots && '--update' || '' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trmnlp-report
          path: report
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: tests/snapshots

  push:
    # Deploys to TRMNL when the TRMNL_API_KEY repository secret is set; skipped
    # otherwise, so a clone without the secret still gets lint and tests.
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TRMNL_API_KEY: ${{ secrets.TRMNL_API_KEY }}
    steps:
      - if: env.TRMNL_API_KEY == ''
        run: echo "TRMNL_API_KEY secret not set, skipping deploy"
      - if: env.TRMNL_API_KEY != ''
        uses: actions/checkout@v6
      - if: env.TRMNL_API_KEY != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - if: env.TRMNL_API_KEY != ''
        run: gem install trmnl_preview
      - if: env.TRMNL_API_KEY != ''
        run: trmnlp push --force
